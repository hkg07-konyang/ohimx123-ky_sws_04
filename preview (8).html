function setState(p){state={...state,...p};render()}
function authHTML(){return `<div class="auth"><div class="auth-grid"><div class="hero"><div class="row"><div class="logo">S</div><div><div class="small muted">NEON GUARDIAN 4.0</div><h1>밤길 안전 귀가 서비스</h1></div></div><p class="muted" style="line-height:1.8">기존 서비스를 바탕으로 풀기능을 유지하면서, 실제 서비스에 가까운 흐름과 프리미엄 네온 커맨드센터형 디자인으로 다시 구성한 버전입니다.</p><div class="grid grid2"><div class="mini"><b>검증 가능한 안전점수</b><br><span class="small muted">CCTV·가로등·편의점·경찰서·위험지점 카운트 표시</span></div><div class="mini"><b>실시간 위치 추적</b><br><span class="small muted">watchPosition 기반, 이탈거리·정지시간·정확도 표시</span></div><div class="mini"><b>긴급 대응 UX</b><br><span class="small muted">3초 길게 누르기, 112 전화, 보호자 문자 링크</span></div><div class="mini"><b>개인정보/동의</b><br><span class="small muted">동의·보관기간·내보내기·삭제 흐름 제공</span></div></div><div class="notice" style="margin-top:16px"><b>데모 계정</b><br>이메일: demo@nightsafe.app / 비밀번호: 1234<br>비밀번호는 해시로 검증되며, 실제 서비스는 서버 인증으로 교체해야 합니다.</div></div><div class="card"><h2>로그인</h2><div id="authErr" class="dangerbox hidden"></div><form id="loginForm" class="stack"><div><label>이메일</label><input id="loginEmail" value="demo@nightsafe.app" autocomplete="email"></div><div><label>비밀번호</label><input id="loginPw" type="password" value="1234" autocomplete="current-password"></div><button type="submit">로그인</button></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>새 사용자 만들기</h3><form id="signupForm" class="stack"><input id="sgName" placeholder="이름"><input id="sgEmail" placeholder="이메일"><input id="sgPw" type="password" placeholder="비밀번호 8자 이상 권장"><button class="secondary" type="submit">회원가입</button></form></div></div></div>`}

function nav(k,l){return `<button class="nav-btn ${state.tab===k?'active':''}" data-nav="${k}">${l}</button>`} function pageTitle(){return {home:'홈 / 원터치 귀가',route:'안전 경로 탐색',live:'실시간 위치 추적',guardian:'보호자 공유',sos:'긴급 SOS',history:'귀가 기록',privacy:'보안·동의 관리',audit:'문제점 보완 현황'}[state.tab]||'안전 귀가'}

function homeHTML(){const r=selRoute(), rt=r?routeRisk(r):null; return `<div class="stack"><div class="grid grid4"><div class="stat"><span class="small muted">현재 위험도</span><strong>${rt?rt.risk+'점':'-'}</strong><span class="small muted">${rt?rt.label:'경로 계산 필요'}</span></div><div class="stat"><span class="small muted">위치 정확도</span><strong>${state.locationAccuracy?Math.round(state.locationAccuracy)+'m':'-'}</strong><span class="small muted">실시간 GPS 기준</span></div><div class="stat"><span class="small muted">공유 상태</span><strong>${state.share.enabled?'ON':'OFF'}</strong><span class="small muted">동의한 보호자 ${state.contacts.filter(c=>c.consent).length}명</span></div><div class="stat"><span class="small muted">경로 이탈</span><strong>${deviationText()}</strong><span class="small muted">선택 경로 기준</span></div></div><div class="two-col"><div class="card"><div class="between"><div><h2 style="margin-top:0">원터치 귀가</h2><p class="muted">밤길에서는 입력을 줄이는 것이 중요하므로 즐겨찾기에서 바로 안전 경로를 계산합니다.</p></div><span class="badge good">핵심 흐름 단순화</span></div><div class="grid grid2">${state.favorites.map(f=>`<button class="secondary" data-fav="${h(f.address)}"><b>${h(f.label)}</b><br><span class="small muted">${h(f.address)}</span></button>`).join('')}</div></div><div class="card"><h2 style="margin-top:0">귀가 전 필수 체크</h2>${check('위치정보 동의',state.consent.location)}${check('보호자 공유 동의',state.consent.guardian)}${check('실시간 GPS',state.tracking)}${check('선택 경로',!!r)}<div class="notice" style="margin-top:12px">실제 위급 상황에서는 앱보다 <b>112 신고와 주변 밝은 장소 이동</b>이 우선입니다.</div></div></div><div class="card"><h2 style="margin-top:0">서비스 보완 핵심</h2><div class="grid grid3"><div class="mini"><b>안전근거 숫자화</b><br><span class="small muted">경로 주변 안전시설 수와 위험요소 수를 점수 근거로 보여줌</span></div><div class="mini"><b>과장 표현 제거</b><br><span class="small muted">AI를 “검증 전 안전 판단 엔진”으로 명시</span></div><div class="mini"><b>오해 방지</b><br><span class="small muted">SOS는 실제 전화/문자 연결 버튼과 시뮬레이션 상태를 구분</span></div></div></div></div>`}
function check(label,on){return `<div class="signal"><span>${label}</span><b>${on?'완료':'필요'}</b></div>`}
function routeHTML(){const r=selRoute();return `<div class="route-grid"><div class="card"><h2 style="margin-top:0">안전 경로 탐색</h2><div class="notice">인도/도보는 자동차 경로로 자동 대체하지 않습니다. 실패하면 “보행 경로 API 한계”로 표시하고, 비상 직선 안내만 별도 표시합니다.</div><div class="grid grid3" style="margin-top:14px"><div><label>출발지</label><input id="originText" value="${h(state.originText)}" placeholder="비우면 현재 위치 또는 대전시청"></div><div><label>목적지</label><input id="destText" value="${h(state.destText)}" placeholder="예: 대전역"></div><div><label>이동 기준</label><select id="modeSelect">${Object.entries(MODE).map(([k,m])=>`<option value="${k}" ${state.mode===k?'selected':''}>${m.icon} ${m.label}</option>`).join('')}</select></div></div><div class="safe-panel" style="margin-top:12px"><b>${MODE[state.mode].icon} ${MODE[state.mode].label} 고정</b><br><span class="small">대상: ${MODE[state.mode].surface} / 제외: ${MODE[state.mode].avoid} / 예상속도: ${MODE[state.mode].kmh}km/h</span></div><div class="grid grid4" style="margin-top:14px"><button id="findRoute">경로 계산</button><button id="useGPS" class="secondary">현재 위치</button><button id="startTrack" class="secondary">실시간 추적</button><button id="simMove" class="secondary">GPS 시뮬레이션</button></div>${state.routeError?`<div class="dangerbox" style="margin-top:12px">${h(state.routeError)}</div>`:''}<div style="margin-top:16px"><div id="map"></div></div>${state.routes.length?`<div class="grid grid3" style="margin-top:14px">${state.routes.map(routeCard).join('')}</div>`:''}</div><div class="stack"><div class="card"><h2 style="margin-top:0">선택 경로 상세</h2>${r?routeDetail(r):'<div class="mini">경로를 계산하면 안전점수 근거, 시설 개수, 단계별 안내가 표시됩니다.</div>'}</div><div class="card"><h3 style="margin-top:0">지도 범례</h3>${legendHTML()}</div></div></div>`}
function routeCard(r){const rr=routeRisk(r), [txt,cls]=tone(100-rr.risk);return `<div class="route-card ${state.selectedRouteId===r.id?'active':''}" data-route="${r.id}"><div class="between"><div><b>${h(r.title)}</b><div class="small muted">${r.distanceText} · ${r.durationText} · ${MODE[r.mode].label}</div></div><span class="badge ${cls}">${rr.risk}점</span></div><div class="tiny muted" style="margin-top:8px">CCTV ${r.evidence.cctv} · 가로등 ${r.evidence.light} · 편의점 ${r.evidence.store} · 위험 ${r.evidence.risk}</div></div>`}
function routeDetail(r){const rr=routeRisk(r), [txt,cls]=tone(100-rr.risk);return `<div class="between"><div><b style="font-size:18px">${h(r.title)}</b><div class="small muted">${r.distanceText} · ${r.durationText} · ${MODE[r.mode].surface}</div></div><span class="badge ${cls}">위험도 ${rr.risk}점</span></div><div style="margin:13px 0"><div class="between"><span class="small">안전 신뢰 점수</span><b>${100-rr.risk}/100</b></div><div class="progress"><span style="width:${100-rr.risk}%"></span></div></div><div class="grid grid2"><div class="mini"><b>안전시설 근거</b><br>CCTV ${r.evidence.cctv}개 · 가로등 ${r.evidence.light}개 · 편의점 ${r.evidence.store}개 · 경찰/안심시설 ${r.evidence.police}개</div><div class="mini"><b>위험요소</b><br>어두운 구간 ${r.evidence.dark}개 · 고립 위험 ${r.evidence.risk}개 · 데이터 신뢰도 ${r.evidence.confidence}</div></div><div class="info" style="margin-top:12px">${rr.reason}</div><div class="grid grid2" style="margin-top:12px"><button id="beginTrip" class="safe">이 경로로 귀가 시작</button><button id="shareRoute" class="secondary">보호자에게 공유</button></div><h3>단계별 안내</h3><div>${r.steps.map((s,i)=>`<div class="step ${state.navStepIndex===i?'active':''}"><b>${i+1}. ${h(s.instruction)}</b><br><span class="small muted">${fmtM(s.distance||0)} · ${fmtT(s.duration||60)}</span></div>`).join('')}</div>`}
function legendHTML(){return `<div class="grid grid2"><div class="mini"><span class="facility-dot">📹</span> CCTV</div><div class="mini"><span class="facility-dot">💡</span> 가로등</div><div class="mini"><span class="facility-dot">🏪</span> 편의점</div><div class="mini"><span class="facility-dot">🚓</span> 경찰/안심시설</div><div class="mini"><span class="facility-dot">⚠️</span> 위험/어두운 구간</div><div class="mini"><span class="facility-dot">🔵</span> 현재 위치</div></div><div class="notice" style="margin-top:12px">현재 안전시설은 시연용 데이터 레이어입니다. 실제 서비스에서는 지자체 CCTV/가로등/안심시설 공공데이터로 교체해야 합니다.</div>`}
function liveHTML(){const r=selRoute(), dev=calcDeviation();return `<div class="stack"><div class="grid grid4"><div class="stat"><span class="small muted">GPS 상태</span><strong>${state.tracking?'추적중':'대기'}</strong><span class="small muted">${state.currentLocation?`${state.currentLocation.lat.toFixed(5)}, ${state.currentLocation.lon.toFixed(5)}`:'위치 없음'}</span></div><div class="stat"><span class="small muted">정확도</span><strong>${state.locationAccuracy?Math.round(state.locationAccuracy)+'m':'-'}</strong><span class="small muted">오차 범위 표시</span></div><div class="stat"><span class="small muted">경로 이탈</span><strong>${dev?Math.round(dev)+'m':'-'}</strong><span class="small muted">80m 이상 주의</span></div><div class="stat"><span class="small muted">마지막 공유</span><strong>${state.share.lastUpdate||'-'}</strong><span class="small muted">보호자 대시보드 갱신</span></div></div><div class="two-col"><div class="card"><h2>실시간 추적 제어</h2><div class="grid grid3"><button id="startTrack2">추적 시작</button><button id="stopTrack" class="secondary">추적 중지</button><button id="simMove2" class="secondary">이동 시뮬레이션</button></div><div class="notice" style="margin-top:12px">브라우저 위치 권한을 허용해야 실제 GPS 추적이 됩니다. 발표/시연 중 권한이 막히면 시뮬레이션 버튼으로 경로 이탈·정지 감지 화면을 확인할 수 있습니다.</div></div><div class="card"><h2>이상상황 감지</h2>${anomalyHTML()}</div></div>${r?`<div class="card"><h2>현재 경로 모니터링</h2>${routeDetail(r)}</div>`:''}</div>`}
function anomalyHTML(){const r=selRoute(), dev=calcDeviation(), issues=[]; if(!state.tracking) issues.push(['GPS 추적 꺼짐','위치가 자동 갱신되지 않습니다.','mid']); if(state.locationAccuracy&&state.locationAccuracy>80) issues.push(['GPS 오차 큼','현재 위치 정확도가 낮아 이탈 판단 신뢰도가 떨어집니다.','mid']); if(dev&&dev>80) issues.push(['경로 이탈 가능','선택 경로와 현재 위치가 멀어졌습니다.','warn']); if(!state.share.enabled) issues.push(['보호자 공유 꺼짐','귀가 중에는 공유를 켜는 것을 권장합니다.','mid']); if(!r) issues.push(['선택 경로 없음','이탈 감지와 ETA 계산을 위해 경로를 선택하세요.','mid']); if(!issues.length) issues.push(['정상 모니터링','현재 큰 이상 신호가 없습니다.','safe']); return issues.map(i=>`<div class="signal"><div><b>${i[0]}</b><br><span class="small muted">${i[1]}</span></div><span class="badge ${i[2]}">${i[2]==='warn'?'주의':'확인'}</span></div>`).join('')}
function guardianHTML(){const token=state.share.token||makeShareToken(false);const link=location.origin+location.pathname+'?guardian='+encodeURIComponent(token);return `<div class="stack"><div class="two-col"><div class="card"><h2>보호자 공유</h2><div class="switch-row signal"><div><b>실시간 공유</b><br><span class="small muted">동의한 보호자에게 현재 위치·경로·상태만 공유</span></div><input id="shareToggle" type="checkbox" ${state.share.enabled?'checked':''} style="width:22px;height:22px"></div><div class="info" style="margin-top:12px"><b>보호자 링크</b><br><span class="small">${h(link)}</span></div><div class="grid grid2" style="margin-top:12px"><button id="copyShare" class="secondary">링크 복사</button><button id="regenToken" class="secondary">토큰 재발급</button></div></div><div class="card"><h2>보호자 대시보드 미리보기</h2>${guardianPreview()}</div></div><div class="card"><div class="between"><h2 style="margin:0">연락처 관리</h2><span class="badge">동의 필수</span></div><div id="contactsList" class="grid grid2" style="margin-top:12px">${state.contacts.map(contactCard).join('')}</div><form id="contactForm" class="grid grid4" style="margin-top:14px"><input id="cName" placeholder="이름"><input id="cRel" placeholder="관계"><input id="cPhone" placeholder="010-0000-0000"><button type="submit">추가</button></form></div></div>`}
function contactCard(c){return `<div class="mini"><div class="between"><div><b>${h(c.name)}</b><br><span class="small muted">${h(c.relation)} · ${h(c.phone)}</span></div><button class="secondary" data-del-contact="${c.id}">삭제</button></div><label class="row small" style="margin-top:10px"><input data-contact-consent="${c.id}" type="checkbox" ${c.consent?'checked':''} style="width:18px;height:18px"> 보호자가 위치 공유에 동의함</label></div>`}
function guardianPreview(){const r=selRoute();return `<div class="grid grid2"><div class="mini"><b>사용자 상태</b><br>${state.tracking?'귀가 중':'대기 중'}</div><div class="mini"><b>마지막 갱신</b><br>${state.share.lastUpdate||'-'}</div><div class="mini"><b>현재 위치</b><br>${state.currentLocation?state.currentLocation.lat.toFixed(5)+', '+state.currentLocation.lon.toFixed(5):'위치 없음'}</div><div class="mini"><b>선택 경로</b><br>${r?h(r.title):'미선택'}</div></div><div class="notice" style="margin-top:12px">보호자 화면은 읽기 전용으로 설계해야 하며, 실제 서비스에서는 별도 인증/만료 토큰/접속 로그가 필요합니다.</div>`}
function sosHTML(){return `<div class="two-col"><div class="card"><h2>SOS 긴급 대응</h2><div class="dangerbox"><b>실제 위급 상황은 112 신고가 우선입니다.</b><br>아래 버튼은 오작동 방지를 위해 3초 이상 길게 눌러야 작동합니다.</div><button id="sosHold" class="hold" style="--p:${state.holdProgress}%"><span>SOS<br><small>${state.holdProgress?Math.round(state.holdProgress)+'%':'3초'}</small></span></button><div class="grid grid3"><a id="call112" href="tel:112"><button type="button" class="danger" style="width:100%">112 전화</button></a><button id="copySOS" class="secondary">문구 복사</button><button id="clearSOS" class="secondary">상태 초기화</button></div><label style="display:block;margin-top:12px">긴급 메시지</label><textarea id="sosText">${h(makeSOSMessage())}</textarea></div><div class="card"><h2>보호자 문자 전송</h2><div class="grid">${state.contacts.filter(c=>c.consent).map(c=>`<a href="sms:${h(c.phone)}?body=${encodeURIComponent(makeSOSMessage())}"><button type="button" class="secondary" style="width:100%">${h(c.name)}에게 문자 열기</button></a>`).join('')||'<div class="notice">동의된 보호자가 없습니다.</div>'}</div><h3>긴급 로그</h3><div class="grid">${state.incidents.slice(0,5).map(i=>`<div class="mini"><b>${h(i.type)}</b><br><span class="small muted">${h(i.time)} · ${h(i.message)}</span></div>`).join('')||'<div class="mini">아직 긴급 로그가 없습니다.</div>'}</div></div></div>`}
function historyHTML(){return `<div class="card"><div class="between"><h2 style="margin:0">귀가 기록</h2><div class="row"><button id="exportData" class="secondary">내보내기</button><button id="clearHistory" class="danger">기록 삭제</button></div></div><div class="grid" style="margin-top:14px">${state.history.map(x=>`<div class="mini"><div class="between"><b>${h(x.title)}</b><span class="badge">${h(x.status)}</span></div><div class="small muted">${h(x.time)} · ${h(x.distance)} · ${h(x.duration)}</div><div class="small">위험도 ${h(x.risk)}점 · ${h(x.destination)}</div></div>`).join('')||'<div class="notice">아직 기록이 없습니다. 경로를 선택하고 귀가 시작을 누르면 기록됩니다.</div>'}</div></div>`}
function privacyHTML(){return `<div class="stack"><div class="card"><h2>개인정보·위치정보 동의</h2><div class="grid grid2"><label class="mini"><input id="consLoc" type="checkbox" ${state.consent.location?'checked':''}> 위치정보 수집 동의<br><span class="small muted">경로 탐색, 이탈 감지, SOS 위치 문구에 사용</span></label><label class="mini"><input id="consGuard" type="checkbox" ${state.consent.guardian?'checked':''}> 보호자 공유 동의<br><span class="small muted">동의한 연락처에게만 위치 상태 공유</span></label><label class="mini"><input id="consRet" type="checkbox" ${state.consent.retention?'checked':''}> 귀가 기록 보관 동의<br><span class="small muted">보관 기간 이후 삭제 권장</span></label><label class="mini"><input id="cons3" type="checkbox" ${state.consent.thirdParty?'checked':''}> 외부 AI/서버 전송 동의<br><span class="small muted">기본 OFF. 현재 파일은 외부 ChatGPT 호출 없음</span></label></div><div class="grid grid3" style="margin-top:14px"><button id="saveConsent">동의 저장</button><button id="deleteAll" class="danger">전체 데이터 삭제</button><button id="toggleTheme" class="secondary">다크/라이트</button></div></div><div class="card"><h2>보안 설정</h2><div class="grid grid3"><div><label>기록 보관 기간</label><select id="retention"><option value="7">7일</option><option value="30">30일</option><option value="90">90일</option></select></div><label class="mini"><input id="largeText" type="checkbox" ${state.settings.largeText?'checked':''}> 큰 글자 모드</label><label class="mini"><input id="mockData" type="checkbox" ${state.settings.simulatePublicData?'checked':''}> 시연용 안전시설 데이터 표시</label></div><div class="notice" style="margin-top:12px">단일 HTML 데모에서는 완전한 서버 인증·암호화·문자 발송을 구현할 수 없습니다. 다만 실제 서비스로 넘어갈 때 필요한 동의/삭제/보관/공유 구조를 화면에 반영했습니다.</div></div></div>`}
function auditHTML(){const rows=[['안전 데이터 부족','경로 주변 안전시설/위험요소 카운트, 지도 마커, 데이터 신뢰도 표시 추가'],['도보/차도 혼동','인도·도보는 자동차 경로로 자동 대체하지 않도록 분리'],['SOS 오해','3초 길게 누르기, 112 전화, 보호자 문자 링크, 시뮬레이션 고지 추가'],['실시간 위치 부재','watchPosition, 정확도, 이탈거리, 시뮬레이션 모드 추가'],['보호자 화면 약함','토큰 링크, 연락처 동의, 읽기전용 대시보드 구조 추가'],['개인정보 문제','동의·보관기간·내보내기·삭제·외부전송 OFF 구조 추가'],['AI 과장','AI 대신 안전 판단 엔진/규칙 기반으로 표현 조정'],['모바일 UX','하단 고정 핵심 버튼, 큰 글자/다크모드 추가']];return `<div class="card"><h2>문제점 보완 현황</h2><table class="source-table"><thead><tr><th>기존 문제</th><th>수정 방향</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table><div class="info" style="margin-top:14px"><b>남은 실제 서비스 과제</b><br>실제 공공데이터 API, 국내 보행자 네비 API, 서버 인증, 푸시/문자 발송, 법률 검토는 HTML 파일만으로 완성할 수 없으므로 백엔드 단계에서 구현해야 합니다.</div></div>`}

async function login(e){e.preventDefault();const email=document.getElementById('loginEmail').value.trim().toLowerCase(),pw=document.getElementById('loginPw').value;const users=load(KEYS.users,[]);const user=users.find(u=>u.email.toLowerCase()===email);const err=document.getElementById('authErr');if(!user){err.textContent='가입된 이메일이 없습니다.';err.classList.remove('hidden');return}const hh=await sha256(pw);if(user.passwordHash!==hh){err.textContent='비밀번호가 맞지 않습니다.';err.classList.remove('hidden');return}save(KEYS.session,{userId:user.id,loginAt:now()});state.user=user;render()}
async function signup(e){e.preventDefault();const name=document.getElementById('sgName').value.trim(),email=document.getElementById('sgEmail').value.trim().toLowerCase(),pw=document.getElementById('sgPw').value;if(!name||!email.includes('@')||pw.length<4){alert('이름, 이메일, 비밀번호를 확인하세요.');return}const users=load(KEYS.users,[]);if(users.some(u=>u.email===email)){alert('이미 가입된 이메일입니다.');return}const user={id:uid('u'),name,email,passwordHash:await sha256(pw),role:'사용자',createdAt:now()};users.push(user);save(KEYS.users,users);save(KEYS.session,{userId:user.id,loginAt:now()});state.user=user;render()}

(KEYS.share,state.share);render()});document.getElementById('copyShare')?.addEventListener('click',copyShare);document.getElementById('regenToken')?.addEventListener('click',()=>{state.share.token=makeShareToken(false);save(KEYS.share,state.share);render()});document.getElementById('contactForm')?.addEventListener('submit',addContact);document.querySelectorAll('[data-del-contact]').forEach(b=>b.onclick=()=>deleteContact(b.dataset.delContact));document.querySelectorAll('[data-contact-consent]').forEach(c=>c.onchange=()=>updateContactConsent(c.dataset.contactConsent,c.checked));bindSOS();document.getElementById('copySOS')?.addEventListener('click',()=>copyText(document.getElementById('sosText')?.value||makeSOSMessage()));document.getElementById('clearSOS')?.addEventListener('click',()=>{state.holdProgress=0;render()});document.getElementById('saveConsent')?.addEventListener('click',saveConsent);document.getElementById('deleteAll')?.addEventListener('click',deleteAllData);document.getElementById('toggleTheme')?.addEventListener('click',toggleTheme);document.getElementById('largeText')?.addEventListener('change',e=>{state.settings.largeText=e.target.checked;save(KEYS.settings,state.settings);document.body.classList.toggle('large',e.target.checked);render()});document.getElementById('mockData')?.addEventListener('change',e=>{state.settings.simulatePublicData=e.target.checked;save(KEYS.settings,state.settings);renderMap()});const ret=document.getElementById('retention');if(ret){ret.value=state.settings.retentionDays||30;ret.onchange=e=>{state.settings.retentionDays=Number(e.target.value);save(KEYS.settings,state.settings)}}document.getElementById('exportData')?.addEventListener('click',exportData);document.getElementById('clearHistory')?.addEventListener('click',()=>{if(confirm('귀가 기록을 삭제할까요?')){state.history=[];save(KEYS.history,[]);render()}});bindChat();if(state.tab==='route') setTimeout(setupMap,0)}
function bindChat(){document.getElementById('chatFab')?.addEventListener('click',()=>setState({chatOpen:!state.chatOpen}));document.getElementById('chatClose')?.addEventListener('click',()=>setState({chatOpen:false}));document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendChat(b.dataset.q));document.getElementById('chatForm')?.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('chatInput').value.trim();if(v)sendChat(v)});const body=document.getElementById('chatBody');if(body)body.scrollTop=body.scrollHeight}
function sendChat(text){state.chat.push({role:'me',text});state.chat.push({role:'ai',text:localReply(text)});state.chatOpen=true;render()}
function localReply(t){const route=selRoute(), low=t.toLowerCase();if(low.includes('공유')&&low.includes('켜')){state.share.enabled=true;if(!state.share.token)state.share.token=makeShareToken(false);state.share.lastUpdate=now();save(KEYS.share,state.share);return '위치 공유를 켰습니다. 동의된 보호자에게 현재 상태를 공유하는 흐름으로 전환했습니다.'}if(low.includes('sos'))return makeSOSMessage();if(low.includes('불안')||low.includes('무서')||low.includes('따라'))return '지금은 휴대폰만 보지 말고 주변 밝은 장소로 이동하세요. 가까운 편의점·상가·지구대 방향을 우선하고, 실제 위급하면 112에 바로 전화하세요. 이 앱에서는 SOS 탭에서 보호자 문자와 112 전화를 열 수 있습니다.';if(route){const rr=routeRisk(route);return `${route.title} 분석입니다. 위험도 ${rr.risk}점, 안전시설은 CCTV ${route.evidence.cctv}개, 가로등 ${route.evidence.light}개, 편의점 ${route.evidence.store}개, 위험요소 ${route.evidence.risk}개로 계산했습니다. ${rr.reason}`}return '아직 선택된 경로가 없습니다. 안전 경로 탭에서 출발지와 목적지를 입력하면 안전근거 기반으로 분석합니다.'}
function setupMap(){if(!window.L)return;const el=document.getElementById('map');if(!el)return;if(state.map){state.map.remove();state.map=null}state.map=L.map('map').setView([DEFAULT_CENTER.lat,DEFAULT_CENTER.lon],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(state.map);renderMap()}
function renderMap(){if(!state.map)return;state.markers.forEach(m=>m.remove());state.routeLines.forEach(l=>l.remove());state.markers=[];state.routeLines=[];const colors=['#16a34a','#2563eb','#dc2626'];state.routes.forEach((r,i)=>{const line=L.polyline(r.geometry.map(p=>[p.lat,p.lon]),{color:colors[i%3],weight:state.selectedRouteId===r.id?8:5,opacity:.85,dashArray:r.mode==='sidewalk'?'8 6':null}).addTo(state.map).bindPopup(`${r.title}<br>위험도 ${routeRisk(r).risk}점`);state.routeLines.push(line)});const r=selRoute();if(r&&state.settings.simulatePublicData){r.facilities.forEach(f=>{const icon=L.divIcon({className:'facility-dot',html:f.icon,iconSize:[22,22]});state.markers.push(L.marker([f.lat,f.lon],{icon}).addTo(state.map).bindPopup(`${f.label}<br>${f.demo?'시연 데이터':'공공데이터'}`))})}if(state.currentLocation){state.markers.push(L.circleMarker([state.currentLocation.lat,state.currentLocation.lon],{radius:9,color:'#2563eb',fillColor:'#60a5fa',fillOpacity:.75}).addTo(state.map).bindPopup(`현재 위치<br>오차 ${Math.round(state.locationAccuracy||0)}m`));if(state.locationAccuracy)state.markers.push(L.circle([state.currentLocation.lat,state.currentLocation.lon],{radius:state.locationAccuracy,color:'#93c5fd',fillOpacity:.08}).addTo(state.map))}const all=[];state.routes.forEach(r=>all.push(...r.geometry.map(p=>[p.lat,p.lon])));if(state.currentLocation)all.push([state.currentLocation.lat,state.currentLocation.lon]);if(all.length)state.map.fitBounds(all,{padding:[30,30]})}
async function requestLocation(){if(!navigator.geolocation){alert('이 브라우저는 위치정보를 지원하지 않습니다.');return}if(!state.consent.location){alert('보안/동의 탭에서 위치정보 수집 동의를 먼저 켜주세요.');setState({tab:'privacy'});return}navigator.geolocation.getCurrentPosition(pos=>{state.currentLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};state.locationAccuracy=pos.coords.accuracy;state.share.lastUpdate=now();save(KEYS.share,state.share);render();},err=>alert('위치 권한을 허용하지 않았거나 위치를 가져오지 못했습니다: '+err.message),{enableHighAccuracy:true,timeout:10000,maximumAge:3000})}
function startWatch(){if(!navigator.geolocation){alert('이 브라우저는 위치정보를 지원하지 않습니다.');return}if(!state.consent.location){alert('위치정보 동의가 필요합니다.');setState({tab:'privacy'});return}if(state.watchId)navigator.geolocation.clearWatch(state.watchId);state.watchId=navigator.geolocation.watchPosition(pos=>{state.currentLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};state.locationAccuracy=pos.coords.accuracy;state.tracking=true;state.share.lastUpdate=now();save(KEYS.share,state.share);render();},{enableHighAccuracy:true,timeout:12000,maximumAge:2000});state.tracking=true;render()}
function stopWatch(){if(state.watchId)navigator.geolocation.clearWatch(state.watchId);state.watchId=null;state.tracking=false;if(state.simTimer){clearInterval(state.simTimer);state.simTimer=null}render()}
function toggleSim(){const r=selRoute();if(!r){alert('먼저 경로를 계산하고 선택하세요.');return}if(state.simTimer){clearInterval(state.simTimer);state.simTimer=null;state.tracking=false;render();return}state.simIndex=0;state.tracking=true;state.simTimer=setInterval(()=>{const pts=r.geometry;state.simIndex=Math.min(pts.length-1,state.simIndex+Math.max(1,Math.floor(pts.length/18)));const p=pts[state.simIndex];state.currentLocation={lat:p.lat,lon:p.lon};state.locationAccuracy=18+Math.round(Math.random()*18);state.share.lastUpdate=now();if(state.simIndex>=pts.length-1){clearInterval(state.simTimer);state.simTimer=null;state.tracking=false}save(KEYS.share,state.share);render()},1300);render()}
async function findRoute(){const origin=document.getElementById('originText')?.value.trim()??state.originText,dest=document.getElementById('destText')?.value.trim()||state.destText,mode=document.getElementById('modeSelect')?.value||state.mode;state.originText=origin;state.destText=dest;state.mode=mode;state.loading=true;state.routeError='';render();try{const start=origin?await geocode(origin):(state.currentLocation?{...state.currentLocation,label:'현재 위치'}:DEFAULT_CENTER);const end=await geocode(dest);const data=await fetchRoute(start,end,mode);state.routes=buildRoutes(data.routes,mode,data.fallback,start,end);state.selectedRouteId=state.routes[0]?.id||null;state.loading=false;render();}catch(e){state.loading=false;state.routeError=e.message;render()}}
async function geocode(q){const local=SAMPLE_PLACES.find(p=>p.name.replace(/\s/g,'').includes(q.replace(/\s/g,''))||q.replace(/\s/g,'').includes(p.name.replace(/\s/g,'')));if(local)return {...local,label:local.name};const params=new URLSearchParams({format:'jsonv2',addressdetails:'1',countrycodes:'kr',limit:'1',q});const res=await fetch('https://nominatim.openstreetmap.org/search?'+params.toString(),{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('장소 검색 서버에 연결하지 못했습니다. 정확한 주소를 입력하거나 잠시 후 다시 시도하세요.');const arr=await res.json();if(!arr?.length)throw new Error('장소 검색 결과가 없습니다. 예: 대전광역시청, 대전역처럼 더 구체적으로 입력하세요.');return {lat:Number(arr[0].lat),lon:Number(arr[0].lon),label:arr[0].display_name}}
async function fetchRoute(start,end,mode){let lastErr=null;for(const profile of (MODE[mode].profiles||[MODE[mode].profile])){try{const url=`https://router.project-osrm.org/route/v1/${profile}/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=polyline&alternatives=true&steps=true`;const res=await fetch(url);if(!res.ok)throw new Error('경로 API 실패');const data=await res.json();if(!data.routes?.length)throw new Error('해당 이동 기준의 경로를 찾지 못했습니다.');return {routes:data.routes,fallback:false,usedProfile:profile}}catch(e){lastErr=e}}if(mode==='car')throw new Error('자동차 경로 계산에 실패했습니다. 네트워크 또는 지도 API 상태를 확인하세요.');return {routes:[straightRoute(start,end,mode)],fallback:true,usedProfile:'emergency-straight'}}
function straightRoute(start,end,mode){const d=haversine(start,end);return {distance:d,duration:d/MODE[mode].speed,geometry:encodePseudo([start,end]),legs:[{steps:[{distance:d,duration:d/MODE[mode].speed,name:'비상 직선 안내',maneuver:{type:'continue'},geometry:encodePseudo([start,end])}]}],fallback:true}}
function encodePseudo(points){return points.map(p=>({lat:p.lat,lon:p.lon}))}
function buildRoutes(rawRoutes,mode,fallback,start,end){const mapped=rawRoutes.slice(0,3).map((raw,i)=>{const geometry=Array.isArray(raw.geometry)?raw.geometry:decodePolyline(raw.geometry).map(p=>({lat:p[0],lon:p[1]}));const duration=mode==='car'?raw.duration:Math.max(60,raw.distance/MODE[mode].speed);const steps=(raw.legs?.[0]?.steps||[]).slice(0,10).map(s=>({instruction:stepText(s,mode),distance:s.distance,duration:mode==='car'?s.duration:Math.max(30,s.distance/MODE[mode].speed)}));if(!steps.length)steps.push({instruction:'경로를 따라 밝고 사람이 있는 구간을 우선해 이동하세요.',distance:raw.distance,duration});const facilities=buildFacilities(geometry);const evidence=countEvidence(geometry,facilities);return {id:uid('r'),title:i===0?'안전 우선 경로':i===1?'균형 경로':'시간 우선 경로',mode,geometry,distance:raw.distance,distanceText:fmtM(raw.distance),duration,durationText:fmtT(duration),steps,facilities,evidence,fallback:fallback||raw.fallback}});return mapped.sort((a,b)=>routeRisk(a).risk-routeRisk(b).risk)}
function stepText(s,mode){const name=s.name?` ${s.name}`:'';const m=s.maneuver?.modifier||'',type=s.maneuver?.type||'';const base=mode==='car'?'차도 기준':'보행 기준';let action='직진';if(m.includes('right'))action='오른쪽';if(m.includes('left'))action='왼쪽';if(type==='depart')action='출발';if(type==='arrive')action='도착';return `${base} · ${action}${name}`}
function decodePolyline(str){let index=0,lat=0,lng=0,coords=[];while(index<str.length){let b,shift=0,result=0;do{b=str.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5}while(b>=0x20);lat+=result&1?~(result>>1):result>>1;shift=0;result=0;do{b=str.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5}while(b>=0x20);lng+=result&1?~(result>>1):result>>1;coords.push([lat/1e5,lng/1e5])}return coords}
function haversine(a,b){const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,lat1=a.lat*Math.PI/180,lat2=b.lat*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function buildFacilities(geom){const icons={cctv:'📹',light:'💡',store:'🏪',police:'🚓',risk:'⚠️',dark:'🌑'};const labels={cctv:'CCTV',light:'가로등',store:'편의점',police:'경찰/안심시설',risk:'고립 위험',dark:'어두운 구간'};const types=['light','cctv','store','light','police','dark','cctv','risk','light','store'];const fs=[];for(let i=1;i<Math.min(geom.length,28);i+=Math.max(1,Math.floor(geom.length/12))){const p=geom[i];for(let j=0;j<2;j++){const t=types[(i+j)%types.length];const off=(j?1:-1)*(0.00025+((i%3)*0.00008));fs.push({id:uid('f'),type:t,icon:icons[t],label:labels[t],lat:p.lat+off,lon:p.lon-off/2,demo:true})}}return fs}
function countEvidence(geom,fs){const ev={cctv:0,light:0,store:0,police:0,risk:0,dark:0,confidence:'시연 데이터'};fs.forEach(f=>{const d=minDistToRoute({lat:f.lat,lon:f.lon},geom);if(d<95&&ev[f.type]!=null)ev[f.type]++});return ev}
function routeRisk(r){let risk=52;const e=r.evidence;risk-=e.light*2.5+e.cctv*3+e.store*2+e.police*4;risk+=e.risk*7+e.dark*5;if(r.mode==='car')risk+=4;if(r.mode==='sidewalk')risk-=6;if(r.fallback)risk+=18;if(r.distance>2500)risk+=5;if(!state.share.enabled)risk+=5;if(!state.consent.location)risk+=5;risk=Math.round(Math.max(12,Math.min(92,risk)));const label=risk>=70?'위험':risk>=50?'주의':risk>=35?'보통':'낮음';const reason=r.fallback?'보행 경로 API 실패로 비상 직선 안내를 사용했습니다. 실제 이동 전 다른 지도앱 확인이 필요합니다.':`안전시설 ${e.cctv+e.light+e.store+e.police}개, 위험요소 ${e.risk+e.dark}개를 반영했습니다.`;return {risk,label,reason}}
function selRoute(){return state.routes.find(r=>r.id===state.selectedRouteId)||null}
function calcDeviation(){const r=selRoute();if(!r||!state.currentLocation)return null;return minDistToRoute(state.currentLocation,r.geometry)}
function deviationText(){const d=calcDeviation();return d?Math.round(d)+'m':'-'}
function minDistToRoute(p,geom){if(!geom?.length)return Infinity;let best=Infinity;for(let i=0;i<geom.length-1;i++){best=Math.min(best,pointSegDist(p,geom[i],geom[i+1]))}return best}
function pointSegDist(p,a,b){const x=p.lon,y=p.lat,x1=a.lon,y1=a.lat,x2=b.lon,y2=b.lat;const A=x-x1,B=y-y1,C=x2-x1,D=y2-y1;let t=(A*C+B*D)/(C*C+D*D||1);t=Math.max(0,Math.min(1,t));return haversine(p,{lat:y1+D*t,lon:x1+C*t})}
function beginTrip(){const r=selRoute();if(!r)return;state.tracking=true;state.share.enabled=true;if(!state.share.token)state.share.token=makeShareToken(false);state.share.lastUpdate=now();state.history.unshift({id:uid('h'),title:r.title,status:'귀가 시작',time:now(),distance:r.distanceText,duration:r.durationText,risk:routeRisk(r).risk,destination:state.destText});save(KEYS.history,state.history);save(KEYS.share,state.share);render()}
function makeShareToken(saveIt=true){const t=uid('share');if(saveIt){state.share.token=t;save(KEYS.share,state.share)}return t}
function copyShare(){const token=state.share.token||makeShareToken(false);copyText(location.origin+location.pathname+'?guardian='+encodeURIComponent(token))}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>alert('복사했습니다.')).catch(()=>prompt('복사하세요',text))}
function addContact(e){e.preventDefault();const name=cName.value.trim(),relation=cRel.value.trim(),phone=cPhone.value.trim();if(!name||!phone){alert('이름과 전화번호를 입력하세요.');return}state.contacts.push({id:uid('c'),name,relation,phone,consent:false,priority:state.contacts.length+1});save(KEYS.contacts,state.contacts);render()}
function deleteContact(id){state.contacts=state.contacts.filter(c=>c.id!==id);save(KEYS.contacts,state.contacts);render()} function updateContactConsent(id,val){state.contacts=state.contacts.map(c=>c.id===id?{...c,consent:val}:c);save(KEYS.contacts,state.contacts);render()}
let holdTimer=null,holdStart=0;function bindSOS(){const btn=document.getElementById('sosHold');if(!btn)return;const start=()=>{holdStart=Date.now();holdTimer=setInterval(()=>{state.holdProgress=Math.min(100,(Date.now()-holdStart)/30);btn.style.setProperty('--p',state.holdProgress+'%');btn.querySelector('small').textContent=Math.round(state.holdProgress)+'%';if(state.holdProgress>=100){clearInterval(holdTimer);triggerSOS()}},80)};const stop=()=>{if(holdTimer)clearInterval(holdTimer);if(state.holdProgress<100){state.holdProgress=0;btn.style.setProperty('--p','0%');btn.querySelector('small').textContent='3초'}};btn.addEventListener('mousedown',start);btn.addEventListener('touchstart',e=>{e.preventDefault();start()},{passive:false});['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>btn.addEventListener(ev,stop))}
function makeSOSMessage(){const loc=state.currentLocation?`현재 위치: ${state.currentLocation.lat.toFixed(6)}, ${state.currentLocation.lon.toFixed(6)}`:'현재 위치: 아직 확인되지 않음';const r=selRoute();return `긴급 상황입니다. 확인 후 연락 부탁드립니다. ${loc}. 선택 경로: ${r?r.title:'없음'}. 시간: ${now()}. 실제 위급 시 112 신고가 필요합니다.`}
function triggerSOS(){const msg=makeSOSMessage();state.incidents.unshift({id:uid('sos'),type:'SOS 길게 누름',time:now(),message:msg});save(KEYS.incidents,state.incidents);state.holdProgress=100;alert('SOS 상태가 기록되었습니다. 실제 위급하면 112 전화 버튼을 누르세요.');render()}
function saveConsent(){state.consent={location:consLoc.checked,guardian:consGuard.checked,retention:consRet.checked,thirdParty:cons3.checked,updatedAt:now()};save(KEYS.consent,state.consent);alert('동의를 저장했습니다.');render()}
function deleteAllData(){if(!confirm('로그인 정보 외 연락처, 기록, 공유, 동의 데이터를 삭제할까요?'))return;[KEYS.contacts,KEYS.favorites,KEYS.history,KEYS.consent,KEYS.share,KEYS.incidents].forEach(k=>localStorage.removeItem(k));init()}
function toggleTheme(){state.settings.theme=(state.settings.theme==='dark'?'light':'dark');save(KEYS.settings,state.settings);document.documentElement.dataset.theme=state.settings.theme;render()}
function exportData(){const data={contacts:state.contacts,history:state.history,incidents:state.incidents,consent:state.consent,share:state.share};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='night-safety-export.json';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('DOMContentLoaded',()=>{init();document.addEventListener('click',e=>{});});
function render(){const app=document.getElementById('app');app.innerHTML=state.user?appHTML():authHTML();document.getElementById('mobileBar')?.classList.toggle('hidden',!state.user);bind();if(state.user&&state.tab==='route')setTimeout(renderMap,20)}
</script>
